server:
  port: ${PORT:4003}

spring:
  application:
    name: booking-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:booking_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2000ms
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URL:http://localhost:4001/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# Ticksy Business Limits & Targets
ticksy:
  hold-ttl-seconds: ${HOLD_TTL_SECONDS:600}
  max-seats-per-booking: ${MAX_SEATS_PER_BOOKING:6}
  catalog-grpc-target: ${CATALOG_GRPC_TARGET:localhost:50052}
  jwt-issuer: ${JWT_ISSUER:ticksy-auth}
  jwt-audience: ${JWT_AUDIENCE:ticksy-api}
  auth-jwks-url: ${AUTH_JWKS_URL:http://localhost:4001/.well-known/jwks.json}

# Resilience4j Circuit Breaker & Retry Specs
resilience4j:
  circuitbreaker:
    instances:
      catalogService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      catalogService:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - io.grpc.StatusRuntimeException

logging:
  level:
    com.ticksy.booking: INFO
    org.springframework.security: WARN
