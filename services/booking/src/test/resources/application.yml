server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:booking_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6380

HOLD_TTL_SECONDS: 600
MAX_SEATS_PER_BOOKING: 6
CATALOG_GRPC_TARGET: localhost:50052
JWT_ISSUER: ticksy-auth
JWT_AUDIENCE: ticksy-api
AUTH_JWKS_URL: http://localhost:4001/.well-known/jwks.json

logging:
  level:
    com.ticksy.booking: INFO
