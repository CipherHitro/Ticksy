server {
    listen 4006;
    server_name _;
    root /app/public;
    index index.php;

    # Security: do not leak server version or PHP info
    server_tokens off;

    # Client limits
    client_max_body_size 10M;

    # Standard routing to Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to FastCGI server (php-fpm container in pod)
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 5s;
    }

    # Deny access to hidden dotfiles (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
