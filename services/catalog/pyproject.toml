[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ticksy-catalog"
version = "0.1.0"
description = "Ticksy event catalog service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0", "pymongo>=4.11,<5.0", "PyJWT[crypto]>=2.9,<3.0",
  "strawberry-graphql[fastapi]>=0.240,<1.0", "grpcio>=1.68,<2.0", "grpcio-tools>=1.68,<2.0",
  "protobuf>=5.28,<7.0", "python-slugify>=8.0,<9.0"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["app"]
