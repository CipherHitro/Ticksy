apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ticksy
type: Opaque
stringData:
  # Notice: This is an example template.
  # Real secret values are kept locally in 'app-secrets.yaml' (git-ignored).
  # Auth DB
  AUTH_DB_USER: "postgres"
  AUTH_DB_PASSWORD: "dev_postgres_password"
  AUTH_DATABASE_URL: "postgresql://postgres:dev_postgres_password@auth-db:5432/auth_db?schema=public"

  # Booking DB & Cache
  BOOKING_DB_ROOT_PASSWORD: "dev_root_password"
  BOOKING_DB_USER: "booking_user"
  BOOKING_DB_PASSWORD: "dev_booking_password"
  BOOKING_MYSQL_URL: "jdbc:mysql://booking-db:3306/booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true"

  # Payment DB
  PAYMENT_DB_USER: "postgres"
  PAYMENT_DB_PASSWORD: "dev_payment_password"
  PAYMENT_DB_CONNECTION: "Host=payment-db;Port=5432;Database=payment_db;Username=postgres;Password=dev_payment_password"

  # RabbitMQ
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"
