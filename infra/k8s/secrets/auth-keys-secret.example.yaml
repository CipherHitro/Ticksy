apiVersion: v1
kind: Secret
metadata:
  name: auth-keys-secret
  namespace: ticksy
type: Opaque
stringData:
  # NOTICE: Never commit real private keys to git.
  # When running ./infra/k8s/deploy.sh, this secret is automatically created
  # directly from your gitignored local keys at 'services/auth/keys/'.
  private.pem: |
    # Paste your private.pem here or let deploy.sh generate it automatically
  public.pem: |
    # Paste your public.pem here or let deploy.sh generate it automatically
