apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: ticksy
  labels:
    app: booking-service
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
        tier: api
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for booking-db (MySQL)..."
              until nc -z -w 2 booking-db 3306; do sleep 2; done
              echo "Waiting for booking-redis..."
              until nc -z -w 2 booking-redis 6379; do sleep 2; done
              echo "Waiting for auth-service..."
              until nc -z -w 2 auth-service 4001; do sleep 2; done
              echo "All dependencies ready!"
      containers:
        # Container 1: Booking Service (Spring Boot 3 / Java 21)
        - name: booking-service
          image: ticksy-booking-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
              name: http
          env:
            - name: PORT
              value: "4003"
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BOOKING_DB_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BOOKING_DB_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BOOKING_DB_NAME
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: BOOKING_DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: BOOKING_DB_PASSWORD
            - name: MYSQL_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: BOOKING_MYSQL_URL
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BOOKING_REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BOOKING_REDIS_PORT
            - name: AUTH_JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_JWKS_URL
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JWT_AUDIENCE
            - name: CATALOG_GRPC_TARGET
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CATALOG_GRPC_TARGET
            - name: HOLD_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: HOLD_TTL_SECONDS
            - name: MAX_SEATS_PER_BOOKING
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MAX_SEATS_PER_BOOKING
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/ticksy
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4003
            initialDelaySeconds: 25
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4003
            initialDelaySeconds: 30
            periodSeconds: 10

        # Container 2: Multi-container Logging / Sidecar
        - name: log-sidecar
          image: busybox:1.36
          command: ["sh", "-c", "touch /var/log/ticksy/booking.log && tail -F /var/log/ticksy/booking.log"]
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/ticksy
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

      volumes:
        - name: shared-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: ticksy
  labels:
    app: booking-service
    tier: api
spec:
  type: ClusterIP
  ports:
    - port: 4003
      targetPort: 4003
      name: http
  selector:
    app: booking-service
