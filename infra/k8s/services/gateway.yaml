apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ticksy
  labels:
    app: gateway
    tier: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: gateway
    spec:
      initContainers:
        - name: wait-for-auth
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for auth-service..."
              until nc -z -w 2 auth-service 4001; do sleep 2; done
              echo "auth-service is reachable!"
      containers:
        # Container 1: API Gateway (TypeScript Express)
        - name: gateway
          image: ticksy-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOG_LEVEL
            - name: AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_URL
            - name: AUTH_JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_JWKS_URL
            - name: CATALOG_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CATALOG_URL
            - name: BOOKING_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BOOKING_URL
            - name: PAYMENT_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PAYMENT_URL
            - name: LEDGER_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LEDGER_URL
            - name: NOTIFICATION_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NOTIFICATION_URL
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/ticksy
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

        # Container 2: Multi-container Logging / Sidecar
        - name: log-sidecar
          image: busybox:1.36
          command: ["sh", "-c", "touch /var/log/ticksy/gateway.log && tail -F /var/log/ticksy/gateway.log"]
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/ticksy
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

      volumes:
        - name: shared-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ticksy
  labels:
    app: gateway
    tier: gateway
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: gateway
