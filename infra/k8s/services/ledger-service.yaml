apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: ticksy
  labels:
    app: ledger-service
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
        tier: api
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for ledger-kurrentdb..."
              until nc -z -w 2 ledger-kurrentdb 2113; do sleep 2; done
              echo "Waiting for ledger-redis..."
              until nc -z -w 2 ledger-redis 6379; do sleep 2; done
              echo "Dependencies ready!"
      containers:
        # Container 1: Ledger Service (.NET 8)
        - name: ledger-service
          image: ticksy-ledger-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4005
              name: http
          env:
            - name: PORT
              value: "4005"
            - name: ASPNETCORE_URLS
              value: "http://+:4005"
            - name: KURRENTDB_CONNECTION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LEDGER_KURRENTDB_URL
            - name: REDIS_CONNECTION
              value: "ledger-redis:6379"
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_SERVICE_URL
            - name: AUTH_JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_JWKS_URL
            - name: Jwt__MetadataAddress
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JWT_METADATA_ADDRESS
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/ticksy
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4005
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4005
            initialDelaySeconds: 15
            periodSeconds: 10

        # Container 2: Multi-container Logging / Sidecar
        - name: log-sidecar
          image: busybox:1.36
          command: ["sh", "-c", "touch /var/log/ticksy/ledger.log && tail -F /var/log/ticksy/ledger.log"]
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/ticksy
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

      volumes:
        - name: shared-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: ticksy
  labels:
    app: ledger-service
    tier: api
spec:
  type: ClusterIP
  ports:
    - port: 4005
      targetPort: 4005
      name: http
  selector:
    app: ledger-service
