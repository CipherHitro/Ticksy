apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ticksy
  labels:
    app: notification-service
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        tier: api
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for notification-rabbitmq..."
              until nc -z -w 2 notification-rabbitmq 5672; do sleep 2; done
              echo "Waiting for notification-redis..."
              until nc -z -w 2 notification-redis 6379; do sleep 2; done
              echo "Dependencies ready!"
      containers:
        # Container 1: Notification Service (PHP Laravel)
        - name: notification-service
          image: ticksy-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4006
              name: http
          env:
            - name: PORT
              value: "4006"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NOTIFICATION_REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NOTIFICATION_REDIS_PORT
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NOTIFICATION_RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NOTIFICATION_RABBITMQ_PORT
            - name: AUTH_JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_JWKS_URL
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JWT_AUDIENCE
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/ticksy
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4006
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4006
            initialDelaySeconds: 15
            periodSeconds: 10

        # Container 2: Multi-container Logging / Sidecar
        - name: log-sidecar
          image: busybox:1.36
          command: ["sh", "-c", "touch /var/log/ticksy/notification.log && tail -F /var/log/ticksy/notification.log"]
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/ticksy
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

      volumes:
        - name: shared-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ticksy
  labels:
    app: notification-service
    tier: api
spec:
  type: ClusterIP
  ports:
    - port: 4006
      targetPort: 4006
      name: http
  selector:
    app: notification-service
