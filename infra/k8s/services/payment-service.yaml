apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ticksy
  labels:
    app: payment-service
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        tier: api
    spec:
      initContainers:
        - name: wait-for-payment-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for payment-db..."
              until nc -z -w 2 payment-db 5432; do sleep 2; done
              echo "payment-db is ready!"
      containers:
        # Container 1: Payment Service (.NET 8)
        - name: payment-service
          image: ticksy-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4004
              name: http
            - containerPort: 50054
              name: grpc
          env:
            - name: PORT
              value: "4004"
            - name: ASPNETCORE_URLS
              value: "http://+:4004"
            - name: PAYMENT_DB_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PAYMENT_DB_CONNECTION
            - name: ConnectionStrings__PaymentDb
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PAYMENT_DB_CONNECTION
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_SERVICE_URL
            - name: AUTH_JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_JWKS_URL
            - name: Jwt__MetadataAddress
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JWT_METADATA_ADDRESS
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/ticksy
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4004
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4004
            initialDelaySeconds: 15
            periodSeconds: 10

        # Container 2: Multi-container Logging / Sidecar
        - name: log-sidecar
          image: busybox:1.36
          command: ["sh", "-c", "touch /var/log/ticksy/payment.log && tail -F /var/log/ticksy/payment.log"]
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/ticksy
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

      volumes:
        - name: shared-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ticksy
  labels:
    app: payment-service
    tier: api
spec:
  type: ClusterIP
  ports:
    - port: 4004
      targetPort: 4004
      name: http
    - port: 50054
      targetPort: 50054
      name: grpc
  selector:
    app: payment-service
