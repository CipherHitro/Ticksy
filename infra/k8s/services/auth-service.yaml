apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ticksy
  labels:
    app: auth-service
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: api
    spec:
      initContainers:
        - name: wait-for-auth-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for auth-db to become ready..."
              until nc -z -w 2 auth-db 5432; do
                sleep 2
              done
              echo "auth-db is ready!"
      containers:
        # Container 1: Main Auth Service
        - name: auth-service
          image: ticksy-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
              name: http
          env:
            - name: PORT
              value: "4001"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AUTH_DATABASE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_SERVICE_URL
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JWT_AUDIENCE
          volumeMounts:
            - name: auth-keys
              mountPath: /app/keys
              readOnly: true
            - name: shared-logs
              mountPath: /var/log/ticksy
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 10

        # Container 2: Multi-container Logging / Sidecar
        - name: log-sidecar
          image: busybox:1.36
          command: ["sh", "-c", "touch /var/log/ticksy/app.log && tail -F /var/log/ticksy/app.log"]
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/ticksy
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

      volumes:
        - name: auth-keys
          secret:
            secretName: auth-keys-secret
        - name: shared-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ticksy
  labels:
    app: auth-service
    tier: api
spec:
  type: ClusterIP
  ports:
    - port: 4001
      targetPort: 4001
      name: http
  selector:
    app: auth-service
