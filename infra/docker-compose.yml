name: ticksy

services:
  # ================= AUTH SERVICE =================
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - '5433:5432' # host:container - 5433 to avoid clashing with local Postgres on 5432
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ../services/auth
    container_name: auth-service
    restart: unless-stopped
    ports:
      - '4001:4001'
    env_file:
      - ../services/auth/.env
    volumes:
      - ../services/auth/keys:/app/keys:ro
    environment:
      DATABASE_URL: postgresql://postgres:postgres@auth-db:5432/auth_db?schema=public
      AUTH_SERVICE_URL: http://auth-service:4001
    depends_on:
      auth-db:
        condition: service_healthy

  # ================= API GATEWAY =================
  gateway:
    build:
      context: ../services/gateway
    container_name: gateway
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - ../services/gateway/.env
    environment:
      AUTH_URL: http://auth-service:4001
      AUTH_JWKS_URL: http://auth-service:4001/.well-known/jwks.json
      CATALOG_URL: http://catalog-service:4002
      BOOKING_URL: http://booking-service:4003
      PAYMENT_URL: http://payment-service:4004
      LEDGER_URL: http://ledger-service:4005
      NOTIFICATION_URL: http://notification-service:4006
    depends_on:
      - auth-service
      - catalog-service
      - booking-service
      - payment-service
      - ledger-service
      - notification-service

  # ================= CATALOG SERVICE =================
  catalog-mongo:
    image: mongo:8
    container_name: catalog-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - catalog_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch(e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'catalog-mongo:27017'}]}).ok }\""]
      interval: 5s
      timeout: 5s
      retries: 20

  catalog-service:
    build:
      context: ..
      dockerfile: services/catalog/Dockerfile
    container_name: catalog-service
    restart: unless-stopped
    ports:
      - "4002:4002"
      - "50052:50052"
    env_file:
      - ../services/catalog/.env
    environment:
      PORT: 4002
      GRPC_PORT: 50052
      MONGODB_URI: mongodb://catalog-mongo:27017/catalog_db?replicaSet=rs0&directConnection=true
      MONGODB_DB: catalog_db
      AUTH_JWKS_URL: http://auth-service:4001/.well-known/jwks.json
      JWT_ISSUER: ticksy-auth
      JWT_AUDIENCE: ticksy-api
      ENVIRONMENT: development
    depends_on:
      catalog-mongo:
        condition: service_healthy
      auth-service:
        condition: service_started

  # ================= BOOKING SERVICE =================
  booking-db:
    image: mysql:8.0
    container_name: booking-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: booking_db
      MYSQL_USER: booking_user
      MYSQL_PASSWORD: booking_pass
    ports:
      - '3307:3306'
    volumes:
      - booking_db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
      interval: 5s
      timeout: 5s
      retries: 5

  booking-redis:
    image: redis:7-alpine
    container_name: booking-redis
    restart: unless-stopped
    ports:
      - '6380:6379'

  booking-service:
    build:
      context: ..
      dockerfile: services/booking/Dockerfile
    container_name: booking-service
    restart: unless-stopped
    ports:
      - '4003:4003'
    env_file:
      - ../services/booking/.env
    environment:
      PORT: 4003
      MYSQL_HOST: booking-db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: booking_db
      MYSQL_USER: booking_user
      MYSQL_PASSWORD: booking_pass
      MYSQL_URL: jdbc:mysql://booking-db:3306/booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      REDIS_HOST: booking-redis
      REDIS_PORT: 6379
      AUTH_JWKS_URL: http://auth-service:4001/.well-known/jwks.json
      JWT_ISSUER: ticksy-auth
      JWT_AUDIENCE: ticksy-api
      CATALOG_GRPC_TARGET: catalog-service:50052
      HOLD_TTL_SECONDS: 600
      MAX_SEATS_PER_BOOKING: 6
    depends_on:
      booking-db:
        condition: service_healthy
      booking-redis:
        condition: service_started
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started

  # ================= PAYMENT SERVICE =================
  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    restart: unless-stopped
    env_file:
      - ../services/payment/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
      POSTGRES_DB: payment_db
    ports:
      - '5434:5432' # host:container - 5434 to avoid clashing with auth-db on 5433 or local postgres on 5432
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: ..
      dockerfile: services/payment/Dockerfile
    container_name: payment-service
    restart: unless-stopped
    ports:
      - '4004:4004'
      - '50054:50054'
    env_file:
      - ../services/payment/.env
    environment:
      PAYMENT_DB_CONNECTION: Host=payment-db;Port=5432;Database=payment_db;Username=postgres;Password=${PAYMENT_DB_PASSWORD}
      ConnectionStrings__PaymentDb: Host=payment-db;Port=5432;Database=payment_db;Username=postgres;Password=${PAYMENT_DB_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:4001
      AUTH_JWKS_URL: http://auth-service:4001/.well-known/jwks.json
      Jwt__MetadataAddress: http://auth-service:4001/.well-known/openid-configuration
    depends_on:
      payment-db:
        condition: service_healthy
      auth-service:
        condition: service_started

  # ================= LEDGER SERVICE =================
  ledger-kurrentdb:
    image: docker.kurrent.io/kurrent-lts/kurrentdb:latest
    container_name: ledger-kurrentdb
    restart: unless-stopped
    command: ['--insecure']
    ports:
      - '2113:2113'
    volumes:
      - ledger_kurrentdb_data:/var/lib/eventstore

  ledger-redis:
    image: redis:7-alpine
    container_name: ledger-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6381:6379'
    volumes:
      - ledger_redis_data:/data

  ledger-service:
    build:
      context: ..
      dockerfile: services/ledger/Dockerfile
    container_name: ledger-service
    restart: unless-stopped
    ports:
      - '4005:4005'
    env_file:
      - ../services/ledger/.env
    environment:
      KURRENTDB_CONNECTION: kurrentdb://ledger-kurrentdb:2113?tls=false
      REDIS_CONNECTION: ledger-redis:6379
      AUTH_SERVICE_URL: http://auth-service:4001
      AUTH_JWKS_URL: http://auth-service:4001/.well-known/jwks.json
      Jwt__MetadataAddress: http://auth-service:4001/.well-known/openid-configuration
    depends_on:
      - ledger-kurrentdb
      - ledger-redis
      - auth-service

  # ================= NOTIFICATION SERVICE =================
  notification-redis:
    image: redis:7-alpine
    container_name: notification-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6382:6379'
    volumes:
      - notification_redis_data:/data

  notification-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: notification-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - notification_rabbitmq_data:/var/lib/rabbitmq

  notification-service:
    build:
      context: ../services/notification
    container_name: notification-service
    restart: unless-stopped
    ports:
      - '4006:4006'
    env_file:
      - ../services/notification/.env
    environment:
      PORT: 4006
      REDIS_HOST: notification-redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: notification-rabbitmq
      RABBITMQ_PORT: 5672
      AUTH_JWKS_URL: http://auth-service:4001/.well-known/jwks.json
    depends_on:
      - notification-redis
      - notification-rabbitmq
      - auth-service

  # ================= FRONTEND =================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - '3000:80'
      - '5173:80'
    depends_on:
      - gateway

volumes:
  auth_db_data:
  catalog_mongo_data:
  booking_db_data:
  payment_db_data:
  ledger_kurrentdb_data:
  ledger_redis_data:
  notification_redis_data:
  notification_rabbitmq_data:
