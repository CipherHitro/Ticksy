# Each service gets its own database - this is the "database per service"
# pattern we planned. As you add Catalog/Booking/etc., add their DBs here
# too (auth-db, catalog-db, booking-db...), never share one Postgres
# instance's schema across services.
name : ticksy

services:
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - '5433:5432' # host:container - 5433 to avoid clashing with a local Postgres on 5432
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ../services/auth
    container_name: auth-service
    restart: unless-stopped
    ports:
      - '4001:4001'
    env_file:
      - ../services/auth/.env
    volumes:
      - ../services/auth/keys:/app/keys:ro
    environment:
      # Inside Docker's network, services reach each other by container
      # name, not localhost - this overrides whatever's in .env for the
      # DB host specifically.
      DATABASE_URL: postgresql://postgres:postgres@auth-db:5432/auth_db?schema=public
    depends_on:
      auth-db:
        condition: service_healthy

  gateway:
    build:
      context: ../services/gateway
    container_name: gateway
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - ../services/gateway/.env
    environment:
      AUTH_URL: http://auth-service:4001
      AUTH_JWKS_URL: http://auth-service:4001/.well-known/jwks.json
      PAYMENT_URL: http://payment-service:4004
      LEDGER_URL: http://ledger-service:4005
      NOTIFICATION_URL: http://notification-service:4006
    depends_on:
      - auth-service
      - payment-service
      - ledger-service
      - notification-service

  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    restart: unless-stopped
    env_file:
      - ../services/payment/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
      POSTGRES_DB: payment_db
    ports:
      - "5434:5432" # host:container - 5434 to avoid clashing with auth-db on 5433 or local postgres on 5432
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: ..
      dockerfile: services/payment/Dockerfile
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "4004:4004"
      - "50054:50054"
    env_file:
      - ../services/payment/.env
    environment:
      PAYMENT_DB_CONNECTION: Host=payment-db;Port=5432;Database=payment_db;Username=postgres;Password=${PAYMENT_DB_PASSWORD}
      ConnectionStrings__PaymentDb: Host=payment-db;Port=5432;Database=payment_db;Username=postgres;Password=${PAYMENT_DB_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:4001
      AUTH_JWKS_URL: http://auth-service:4001/.well-known/jwks.json
    depends_on:
      payment-db:
        condition: service_healthy
      auth-service:
        condition: service_started

  ledger-kurrentdb:
    image: docker.kurrent.io/kurrent-lts/kurrentdb:latest
    container_name: ledger-kurrentdb
    restart: unless-stopped
    command: ["--insecure"]
    ports:
      - "2113:2113"
    volumes:
      - ledger_kurrentdb_data:/var/lib/eventstore

  ledger-redis:
    image: redis:7-alpine
    container_name: ledger-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - ledger_redis_data:/data

  ledger-service:
    build:
      context: ..
      dockerfile: services/ledger/Dockerfile
    container_name: ledger-service
    restart: unless-stopped
    ports:
      - "4005:4005"
    env_file:
      - ../services/ledger/.env
    environment:
      KURRENTDB_CONNECTION: kurrentdb://ledger-kurrentdb:2113?tls=false
      REDIS_CONNECTION: ledger-redis:6379
      AUTH_SERVICE_URL: http://auth-service:4001
      AUTH_JWKS_URL: http://auth-service:4001/.well-known/jwks.json
    depends_on:
      - ledger-kurrentdb
      - ledger-redis
      - auth-service

  notification-redis:
    image: redis:7-alpine
    container_name: notification-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6382:6379"
    volumes:
      - notification_redis_data:/data

  notification-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: notification-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - notification_rabbitmq_data:/var/lib/rabbitmq

  notification-service:
    build:
      context: ../services/notification
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "4006:4006"
    env_file:
      - ../services/notification/.env
    environment:
      PORT: 4006
      REDIS_HOST: notification-redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: notification-rabbitmq
      RABBITMQ_PORT: 5672
      AUTH_JWKS_URL: http://auth-service:4001/.well-known/jwks.json
    depends_on:
      - notification-redis
      - notification-rabbitmq
      - auth-service

volumes:
  auth_db_data:
  payment_db_data:
  ledger_kurrentdb_data:
  ledger_redis_data:
  notification_redis_data:
  notification_rabbitmq_data: